<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lese-Stadt v169 - Settings Overhaul</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50; --accent: #f1c40f; --action: #27ae60; --undo: #7f8c8d; --ui-bg: #fff;
            --danger: #e74c3c;
            --bg-world: #87CEEB;
            --iso-w: 132px; --iso-h: 66px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        input, textarea, button, select { user-select: auto !important; pointer-events: auto !important; }

        body { margin: 0; height: 100vh; background: #f0f0f0; font-family: 'Roboto', sans-serif; display: flex; flex-direction: column; overflow: hidden; }

        /* CONTENT */
        #content { flex: 1; position: relative; overflow: hidden; background: var(--bg-world); }
        .page { display: none; width: 100%; height: 100%; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        .page.active { display: block; }
        
        /* LESEN */
        #p-focus.active { 
            display: flex; flex-direction: column; 
            height: 100%; 
            text-align: center; position: relative; z-index: 10; 
            background: var(--ui-bg); padding-top: 20px; 
        }
        
        /* NAVIGATOR */
        .nav-header {
            display: flex; align-items: center; justify-content: space-between;
            background: #f8f9fa; padding: 10px; border-radius: 12px;
            margin-bottom: 10px; border: 1px solid #eee; flex-shrink: 0;
        }
        .nav-header button {
            background: none; border: none; font-size: 24px; color: var(--primary);
            cursor: pointer; padding: 0 15px;
        }
        .nav-header button:disabled { color: #ccc; cursor: default; }
        .nav-title { font-size: 18px; font-weight: bold; color: var(--primary); }

        /* TIMER DIGITS */
        #timer-box { transition: opacity 0.3s; margin-bottom: 10px; }
        #timer-box.hidden { display: none; }
        #timer-display { font-size: 80px; font-weight: 300; color: var(--primary); margin: 5px 0; font-variant-numeric: tabular-nums; }
        
        /* PROGRESS */
        .progress-section { margin-bottom: 20px; flex-shrink: 0; }
        .progress-bar { width: 100%; height: 30px; background: #ddd; border-radius: 15px; overflow: hidden; margin-top: 5px; position: relative; }
        .progress-fill { height: 100%; background: var(--action); width: 0%; transition: width 0.3s ease-out; display: block; }
        
        /* CONTROLS */
        .controls-spacer { flex: 1; min-height: 20px; } 
        .controls-area { padding-bottom: 20px; flex-shrink: 0; }

        .btn-main { background: var(--action); color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; width: 100%; box-shadow: 0 4px 0 #1e8449; cursor: pointer; margin-bottom: 15px; transition: all 0.2s; }
        .btn-main:active { transform: translateY(4px); box-shadow: none; }
        .btn-main.done { background: var(--undo); box-shadow: 0 4px 0 #5f6a6a; }
        .btn-main.pause { background: var(--accent); box-shadow: 0 4px 0 #d4ac0d; color: #fff; }
        
        /* Utility */
        .d-none { display: none !important; }

        /* STADT */
        #p-city { padding: 0; overflow: hidden; position: relative; background: transparent; }
        #viewport { width: 100%; height: 100%; cursor: grab; position: relative; overflow: hidden; touch-action: none; z-index: 5; }
        #viewport:active { cursor: grabbing; }
        #camera { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; will-change: transform; }

        .iso-obj { 
            position: absolute; pointer-events: none; background-repeat: no-repeat; 
            transform-origin: bottom center; image-rendering: pixelated;
            backface-visibility: hidden; 
        }
        .car {
            position: absolute; pointer-events: none; z-index: 9000;
            background-image: url('https://raw.githubusercontent.com/moinmaxtech/lesestadt/main/sheet_allCars.png');
            image-rendering: pixelated;
            transform-origin: center bottom;
            will-change: transform;
        }

        .sheet-buildings { background-image: url('https://raw.githubusercontent.com/moinmaxtech/lesestadt/main/buildingTiles_sheet.png'); }
        .sheet-city { background-image: url('https://raw.githubusercontent.com/moinmaxtech/lesestadt/main/cityTiles_sheet.png'); }
        .grid-tile {
            position: absolute; width: var(--iso-w); height: var(--iso-h);
            margin-left: calc(var(--iso-w) / -2); margin-top: calc(var(--iso-h) / -2);
            background-image: url("data:image/svg+xml,%3Csvg width='132' height='66' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M66 0 L132 33 L66 66 L0 33 Z' fill='rgba(255,255,255,0.1)' stroke='rgba(255,255,255,0.4)' stroke-width='1'/%3E%3C/svg%3E");
        }
        .grid-tile.grass {
            background-image: url("data:image/svg+xml,%3Csvg width='132' height='66' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M66 0 L132 33 L66 66 L0 33 Z' fill='rgba(100, 200, 100, 0.6)' stroke='rgba(255,255,255,0.3)' stroke-width='1'/%3E%3C/svg%3E");
        }

        /* LOGBUCH */
        .key-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; min-height: 50px; background: #f9f9f9; padding: 10px; border-radius: 8px; }
        .key-item { 
            width: 40px; height: 40px; background: #fff; border-radius: 50%; border: 2px solid #f1c40f;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer;
        }
        .key-item.used { background: #eee; filter: grayscale(1); opacity: 0.5; cursor: default; box-shadow: none; border-color: #ccc; }

        /* CALENDAR */
        .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 5px; text-align: center; font-size: 10px; color: #999; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 20px; }
        .cal-day { 
            aspect-ratio: 1; background: #fff; border: 1px solid #e0e0e0; 
            border-radius: 8px; position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .cal-day.empty { background: transparent; border: none; }
        .cal-day span { 
            position: absolute; top: 3px; left: 5px; font-size: 10px; color: #aaa; z-index: 2;
        }
        .cal-day.today { border: 2px solid var(--primary); }
        .cal-day.today span { color: var(--primary); font-weight: bold; }
        .cal-day.read { background-color: var(--action); border-color: var(--action); }
        .cal-day.read span { color: rgba(255,255,255,0.7); }
        .day-content { font-size: 22px; line-height: 1; z-index: 1; }

        /* SETUP STYLES */
        .set-group { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .set-group h3 { margin-top: 0; color: var(--primary); font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .set-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .set-row label { font-weight: bold; color: #555; }
        .set-row input[type="number"] { width: 60px; padding: 5px; border: 1px solid #ddd; border-radius: 4px; text-align: center; }
        .set-row input[type="checkbox"] { transform: scale(1.5); }
        
        .btn-reset { background: var(--danger); color: white; border: none; padding: 15px; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; }
        .version-info { text-align: center; color: #aaa; font-size: 10px; margin-top: 20px; }

        nav { height: 60px; background: #fff; border-top: 1px solid #ccc; flex-shrink: 0; display: flex; z-index: 200; position: fixed; bottom: 0; width: 100%; }
        .nav-btn { flex: 1; border: none; background: transparent; color: #999; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; }
        .nav-btn.active { color: var(--primary); font-weight: bold; background: #f8f9fa; border-top: 3px solid var(--accent); }
        .nav-btn span { font-size: 24px; margin-bottom: 2px; }
    </style>
</head>
<body>

<main id="content">
    
    <div id="p-focus" class="page active">
        <div class="nav-header">
            <button onclick="app.changeViewDate(-1)">◀</button>
            <span id="date-display" class="nav-title">Heute</span>
            <button id="btn-next-day" onclick="app.changeViewDate(1)" disabled>▶</button>
        </div>

        <div id="timer-box">
            <div id="timer-display">10:00</div>
        </div>

        <div class="progress-section">
            <div>Fortschritt: <span id="ui-prog">0</span> / <span id="ui-goal">3</span></div>
            <div class="progress-bar"><div class="progress-fill" id="prog-bar"></div></div>
        </div>
        
        <div class="controls-spacer"></div>
        
        <div class="controls-area">
            <button id="btn-timer" class="btn-main" onclick="app.toggleTimer()">TIMER START</button>
            <button id="btn-action" class="btn-main" onclick="app.toggleDay()">Einheit erfassen</button>
            <div id="action-hint" style="font-size:10px; color:#999;">(Tippe erneut zum Rückgängig machen)</div>
        </div>
    </div>

    <div id="p-city" class="page">
        <div style="position:absolute; top:10px; left:10px; z-index:100; background:white; padding:5px 10px; border-radius:5px; border:1px solid #ccc;">
             🏠 <span id="ui-count">0</span>
        </div>
        <div id="viewport">
            <div id="camera"></div>
        </div>
    </div>

    <div id="p-cal" class="page">
        <h3>Schlüsselbund</h3>
        <div id="key-grid" class="key-container"></div>
        
        <div class="nav-header" style="margin-top:20px;">
            <button onclick="app.changeMonth(-1)">◀</button>
            <span id="cal-month-display" class="nav-title">Monat</span>
            <button onclick="app.changeMonth(1)">▶</button>
        </div>
        
        <div class="cal-weekdays">
            <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
        </div>
        <div id="cal-grid" class="cal-grid"></div>
    </div>

    <div id="p-set" class="page">
        
        <div class="set-group">
            <h3>Ziele & Zeit</h3>
            <div class="set-row">
                <label>Tagesziel (Einheiten):</label>
                <input type="number" id="inp-goal" value="3">
            </div>
            <div class="set-row">
                <label>Timer (Minuten):</label>
                <input type="number" id="inp-time" value="10">
            </div>
            <button class="btn-main" style="margin-bottom:0;" onclick="app.saveSettings()">Speichern</button>
        </div>

        <div class="set-group">
            <h3>Grafik</h3>
            <div class="set-row">
                <label>Verkehr anzeigen:</label>
                <input type="checkbox" id="chk-traffic" onchange="app.saveSettings()">
            </div>
        </div>

        <div class="set-group">
            <h3>Datenverwaltung</h3>
            <textarea id="inp-backup" style="width:100%; height:50px; font-family:monospace; margin-bottom:10px; border:1px solid #ddd;" placeholder="Backup Code hier..."></textarea>
            <div style="display:flex; gap:10px;">
                <button onclick="app.loadBackup()" style="flex:1; padding:10px;">Laden</button>
                <button onclick="app.copyBackup()" style="flex:1; padding:10px;">Kopieren</button>
            </div>
        </div>

        <div class="set-group" style="border:1px solid var(--danger);">
            <h3 style="color:var(--danger);">Danger Zone</h3>
            <button class="btn-reset" onclick="app.reset()">⚠️ ALLES LÖSCHEN</button>
        </div>

        <div class="version-info">Lese-Stadt v169.0</div>
    </div>

    <div id="sorter-modal" style="display:none;"></div>

</main>

<nav>
    <button class="nav-btn active" onclick="app.tab('p-focus', this)"><span>📖</span>Lesen</button>
    <button class="nav-btn" onclick="app.tab('p-city', this)"><span>🏙️</span>Stadt</button>
    <button class="nav-btn" onclick="app.tab('p-cal', this)"><span>🎫</span>Logbuch</button>
    <button class="nav-btn" onclick="app.tab('p-set', this)"><span>⚙️</span>Setup</button>
</nav>

            this.state.history = this.state.history.filter(d => d !== dateStr);
            // Reduce global progress if undid something
            if (this.state.progress > 0) this.state.progress--;

    buildHouse() {
        const cats = this.state.cats;
        const colors = ['yellow', 'red', 'white', 'brown'];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const bases = cats['base_' + color];
        if(!bases || !bases.length) { console.warn("No base"); return; }

        const count = this.state.buildings.length;
        const blockIdx = Math.floor(count / 8); 
        const houseIdx = count % 8;
        
        const k = Math.floor(Math.sqrt(blockIdx));
        const rem = blockIdx - k * k;
        let bx, by;
        if (rem < k) { bx = k; by = rem; }
        else { bx = 2 * k - rem; by = k; }
        
        const clusterX = bx * 4; 
        const clusterY = by * 4;

        const ring = [{x:0,y:0}, {x:1,y:0}, {x:2,y:0}, {x:2,y:1}, {x:2,y:2}, {x:1,y:2}, {x:0,y:2}, {x:0,y:1}];
        const pos = ring[houseIdx];
        const gx = clusterX + pos.x;
        const gy = clusterY + pos.y;

        const rnd = Math.random() * 100;
        let floorCount = (rnd < 20) ? 0 : (rnd < 50 ? 1 : (rnd < 75 ? 2 : (rnd < 90 ? 3 : 4)));

        const hMids = [];
        const midSrc = cats['mid_' + color] || [];
        for(let i=0; i<floorCount; i++) {
            if(midSrc.length > 0) hMids.push(this.state.atlasBuild[midSrc[Math.floor(Math.random()*midSrc.length)]]);
        }
        const roofSrc = cats.roofs || [];
        this.state.buildings.push({
            gx: gx, gy: gy,
            parts: {
                base: this.state.atlasBuild[bases[Math.floor(Math.random()*bases.length)]],
                mids: hMids,
                roof: roofSrc.length > 0 ? this.state.atlasBuild[roofSrc[Math.floor(Math.random()*roofSrc.length)]] : null
            }
        });
    },

        const stepH = (CONFIG.isoH + (spacing/2)) / 2;
        
        let maxGX = 3, maxGY = 3; 
        this.state.buildings.forEach(b => { maxGX = Math.max(maxGX, b.gx); maxGY = Math.max(maxGY, b.gy); });
        
        const gridX = Math.max(4, Math.ceil((maxGX+1)/4)*4); 
        const gridY = Math.max(4, Math.ceil((maxGY+1)/4)*4);
        
        const roads = { v: this.state.cats.st_v||[], h: this.state.cats.st_h||[], x: this.state.cats.st_cross||[] };
        const Z_F = 100;

        for(let gx=0; gx<gridX; gx++) {

                const top = (gx + gy) * stepH;
                const tile = document.createElement('div');
                tile.className = 'grid-tile';
                const isSX = (gx % 4 === 3);

                if(!isSX && !isSY) tile.classList.add('grass');

        const car = document.createElement('div');
        car.className = 'car';
        car.style.width = sprite.w + 'px';
        car.style.height = sprite.h + 'px';
        car.style.backgroundPosition = `-${sprite.x}px -${sprite.y}px`;
        
        const offset = 100; 
        const tW = CONFIG.isoW; 
        const laneShiftX = (startTile.dir === 'SE') ? this.state.settings.laneSE : this.state.settings.laneSW;
        
        const firstX = firstTile.left + (tW/2);
        const firstY = firstTile.top;
        const lastX = lastTile.left + (tW/2);
        const lastY = lastTile.top;

        let vx = lastX - firstX;
        let vy = lastY - firstY;

        let startX = firstX + laneShiftX;
        let startY = firstY;

        const extend = -40; // SYMMETRICAL CUTOFF
        
        const len = Math.sqrt(vx*vx + vy*vy);
        const ux = vx / len; 
        const uy = vy / len;

        startX -= (ux * offset);
        startY -= (uy * offset);

        const totalLen = len + offset + extend;
        
        const endX = startX + (ux * totalLen);
        const endY = startY + (uy * totalLen);

        car.style.transform = `scaleX(1)`;
        
        const lift = this.state.settings.carY;
        car.style.left = '0'; 
        car.style.top = '0';
        car.style.transform = `translate3d(${startX}px, ${startY + lift}px, 0) scaleX(1)`;
        
        cam.appendChild(car);

        const dx = endX - startX;
        const dy = endY - startY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const speedVal = this.state.settings.carSpeed || 2;
        const speedFactor = Math.max(1, 21 - speedVal); 
        const duration = dist * speedFactor;

        let startTime = null;

        function animate(time) {
            if (!startTime) startTime = time;
            const progress = (time - startTime) / duration;

            if (progress < 1) {
                const curX = startX + (dx * progress);
                const curY = (startY + lift) + (dy * progress);
                
                const lh = 0.3; 
                const zo = 15; 
                
                const curGx = firstTile.gx + (lastTile.gx - firstTile.gx) * (progress + lh); 
                const curGy = firstTile.gy + (lastTile.gy - firstTile.gy) * (progress + lh);
                const zIndex = Math.floor((curGx + curGy) * 100) + zo;

                let transformStr = `translate3d(${curX}px, ${curY}px, 0)`;
                if (startTile.dir === 'SW') transformStr += ` scaleX(1)`; 
                
                car.style.transform = transformStr;
                car.style.zIndex = zIndex;

                requestAnimationFrame(animate);
            } else {
                car.remove();
            }
        }
        requestAnimationFrame(animate);
    },

    renderLogbook() {
        const k = document.getElementById('key-grid'); 
        if(!k) return;
        k.innerHTML = '';
        this.state.tickets.forEach((t, i) => {
            const el = document.createElement('div');
            el.className = 'key-item ' + (t.used?'used':'');
            el.innerHTML = '🗝️';
            if(!t.used) el.onclick = () => { if(confirm('Einlösen?')) { this.state.tickets[i].used=true; this.save(); this.renderLogbook(); }};
            k.appendChild(el);
        });
        
        const c = document.getElementById('cal-grid'); 
        if(!c) return;
        c.innerHTML = '';
        
        const year = this.calDate.getFullYear();
        const month = this.calDate.getMonth();
        
        const monthNames = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
        document.getElementById('cal-month-display').innerText = `${monthNames[month]} ${year}`;
        
        const firstDay = new Date(year, month, 1).getDay(); 
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const startOffset = (firstDay === 0) ? 6 : firstDay - 1;
        
        for(let j=0; j<startOffset; j++) {
            const d = document.createElement('div');
            d.className = 'cal-day empty';
            c.appendChild(d);
        }
        
        const today = new Date();
        
        for(let i=1; i<=daysInMonth; i++) {
            const d = document.createElement('div');
            d.className = 'cal-day';
            
            const dStr = i + '.' + (month+1) + '.' + year;
            
            if(this.state.history.includes(dStr)) {
                d.classList.add('read');
            }
            
            if(i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                d.classList.add('today');
            }

            const hasKey = this.state.tickets.some(t => t.date === dStr);
            
            let html = `<span>${i}</span>`;
            if(hasKey) {
                html += `<div class="day-content">🗝️</div>`;
            }
            
            d.innerHTML = html;
            c.appendChild(d);
        }
    },

    initInput() {
        const vp = document.getElementById('viewport');
        let isDown=false, lx, ly;
        vp.onmousedown = e => { if(e.target.tagName!=='INPUT' && e.target.tagName!=='BUTTON') { isDown=true; lx=e.clientX; ly=e.clientY; }};
        window.onmouseup = () => isDown=false;
        window.onmousemove = e => { if(isDown) { this.state.cam.x += e.clientX-lx; this.state.cam.y += e.clientY-ly; lx=e.clientX; ly=e.clientY; this.updateCam(); }};
        
        vp.ontouchstart = e => { if(e.target.tagName!=='INPUT' && e.target.tagName!=='BUTTON') { isDown=true; lx=e.touches[0].clientX; ly=e.touches[0].clientY; }};
        window.ontouchend = () => isDown=false;
        vp.ontouchmove = e => { if(isDown) { this.state.cam.x += e.touches[0].clientX-lx; this.state.cam.y += e.touches[0].clientY-ly; lx=e.touches[0].clientX; ly=e.touches[0].clientY; this.updateCam(); }};
        
        vp.addEventListener('wheel', e => { e.preventDefault(); this.state.cam.zoom = Math.max(0.2, Math.min(this.state.cam.zoom + (e.deltaY > 0 ? -0.1 : 0.1), 3)); this.updateCam(); });
    },

    updateCam() { 
        document.getElementById('camera').style.transform = `translate(${this.state.cam.x}px, ${this.state.cam.y}px) scale(${this.state.cam.zoom})`; 
    },

    tab(id, btn) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(btn) btn.classList.add('active');
        if(id==='p-city') this.renderCity();
        if(id==='p-cal') this.renderLogbook();
    },

    updateUI() {
        const dateStr = this.viewDate.toLocaleDateString();
        const isToday = dateStr === new Date().toLocaleDateString();
        const hasRead = this.state.history.includes(dateStr);
        const btnTimer = document.getElementById('btn-timer');
        const btnAction = document.getElementById('btn-action');
        const timerBox = document.getElementById('timer-box');
        
        document.getElementById('date-display').innerText = isToday ? "Heute" : dateStr;
        document.getElementById('btn-next-day').disabled = isToday;

        if (isToday) {
            timerBox.classList.remove('hidden');
            btnTimer.classList.remove('d-none');
        } else {
            timerBox.classList.add('hidden');
            btnTimer.classList.add('d-none');
        }

        const totalSec = Math.max(0, this.timer.left);
        const m = Math.floor(totalSec/60).toString().padStart(2, '0');
        const s = (totalSec%60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${m}:${s}`;
        
        if(this.timer.running) {
            btnTimer.innerText = "PAUSE";
            btnTimer.classList.add('pause');
        } else {
            btnTimer.innerText = (totalSec < (this.state.settings.timer*60) && totalSec > 0) ? "WEITER" : "TIMER START";
            btnTimer.classList.remove('pause');
        }

        document.getElementById('ui-prog').innerText = this.state.progress;
        const pct = Math.min(100, (this.state.progress / this.state.settings.goal) * 100);
        document.getElementById('prog-bar').style.width = pct + '%';
        
        if(hasRead) {
            btnAction.innerText = isToday ? "✅ Heute erledigt" : `✅ Am ${dateStr.slice(0,5)} erledigt`;
            btnAction.classList.add('done');
        } else {
            btnAction.innerText = isToday ? "Einheit erfassen" : "Nachtragen";
            btnAction.classList.remove('done');
        }
    },

    saveSettings() { 
        this.state.settings.goal=parseInt(document.getElementById('inp-goal').value); 
        this.state.settings.timer=parseInt(document.getElementById('inp-time').value); 
        // Save traffic
        this.state.settings.showCars = document.getElementById('chk-traffic').checked;
        this.save(); 
        
        // Apply traffic change immediately if needed
        if(!this.state.settings.showCars) {
             document.querySelectorAll('.car').forEach(c => c.remove());
        }
        
        alert("Gespeichert");
    },
    save() { localStorage.setItem('LeseStadt_v169', JSON.stringify(this.state)); },
    reset() { if(confirm("ALLES löschen?")) { localStorage.removeItem('LeseStadt_v169'); location.reload(); } },
    loadDefaults() { if(confirm("Überschreiben?")) { this.state = JSON.parse(JSON.stringify(USER_DATA)); this.save(); location.reload(); }},
    loadBackup() { try { this.state = JSON.parse(document.getElementById('inp-backup').value); this.save(); location.reload(); } catch(e) { alert("Fehler"); } },
    copyBackup() { navigator.clipboard.writeText(JSON.stringify(this.state)); alert("Kopiert"); }
};
app.init();
</script>
